services:
  front-end:
    build: ./requirements/front-end
    image: front-end
    container_name: front-end
    restart: always
    secrets: admi_passwd
    networks: ft_transcendence

  back-end:
    build: ./requirements/back-end
    image: back-end
    container_name: back-end
    restart: always
    secrets: admi_passwd
    networks: ft_transcendence

  data-base:
    build: ./requirements/data-base
    image: data-base
    container_name: data-base
    restart: always
    secrets: admi_passwd
    networks: ft_transcendence

volumes:

networks:
  ft_transcendence:
    drive: bridge

secrets:
  admi_passwd:
    file: ../secrets/admin_passwd.txt