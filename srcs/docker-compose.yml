services:
  front-end:
    build: ./frontend
    image: frontend
    container_name: frontend
    restart: always
    # secrets: admi_passwd
    networks:
      - ft_transcendence

  back-end:
    build: ./backend
    image: backend
    container_name: backend
    restart: always
    # secrets: admi_passwd
    networks:
      - ft_transcendence

networks:
  ft_transcendence:
    driver: bridge

