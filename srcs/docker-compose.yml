services:
  back-end:
    build: ./backend
    image: backend
    container_name: backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "3001:3001"
    networks:
      - ft_transcendence

  front-end:
    build: ./frontend
    image: frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - ft_transcendence
    depends_on:
      - back-end

networks:
  ft_transcendence:
    driver: bridge