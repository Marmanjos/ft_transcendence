services:
  back-end:
    build: ./backend
    image: backend
    container_name: backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "3001:3001"
    volumes:
      - backend_data:/app/uploads
    networks:
      - ft_transcendence

  front-end:
    build: ./frontend
    image: frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - ft_transcendence
    depends_on:
      - back-end


volumes:
  backend_data:
      driver: local
      driver_opts:
        type: none
        o: bind
        device: ${HOME}/data/backend


networks:
  ft_transcendence:
    driver: bridge